name: Playwright Tests
on:
  # Run the test suite for every branch push, including feature branches.
  push:
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter=html --config=GitHub_Smoke_Test.config.js --project=chrome tests/UIBasicstest.spec.js tests/seed.spec.ts
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report
        retention-days: 30
    - name: Publish Playwright report summary
      if: always()
      run: |
        echo "## Playwright HTML Report" >> $GITHUB_STEP_SUMMARY
        echo "Download the report artifact named **playwright-report** from the Actions artifacts panel." >> $GITHUB_STEP_SUMMARY
        echo "Artifacts: https://github.com/${GITHUB_REPOSITORY}/suites/${GITHUB_RUN_ID}/artifacts" >> $GITHUB_STEP_SUMMARY
