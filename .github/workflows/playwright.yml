name: Playwright Tests
on:
  # Run the test suite for every branch push, including feature branches.
  push:
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter=html --config=GitHub_Smoke_Test.config.js --project=chrome tests/UIBasicstest.spec.js tests/seed.spec.ts
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report
        retention-days: 30

    - name: Deploy Playwright report to gh-pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        publish_branch: gh-pages

    - name: Publish Playwright report summary
      if: always()
      run: |
        repo=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
        echo "## Playwright HTML Report" >> $GITHUB_STEP_SUMMARY
        echo "The report is published to GitHub Pages:" >> $GITHUB_STEP_SUMMARY
        echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo}/playwright-report/index.html" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "If the Pages site isn't ready yet, download the report artifact from Actions artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "https://github.com/${GITHUB_REPOSITORY}/suites/${GITHUB_RUN_ID}/artifacts" >> $GITHUB_STEP_SUMMARY
