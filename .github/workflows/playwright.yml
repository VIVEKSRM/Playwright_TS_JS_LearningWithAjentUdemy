name: Playwright Tests
on:
  # Run the test suite for every branch push, including feature branches.
  push:
  pull_request:
    branches: [ main, master ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter=html --config=GitHub_Smoke_Test.config.js --project=chrome tests/UIBasicstest.spec.js tests/seed.spec.ts
    - name: Verify Playwright output directories
      if: always()
      run: |
        echo "Listing report directory contents:"
        ls -la playwright-report || true
        echo "Listing Playwright test-results contents:"
        find test-results -maxdepth 3 -type f | sort || true

    - id: upload_artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-artifacts
        path: |
          playwright-report/**
          test-results/**
        retention-days: 30
        if-no-files-found: warn

    - name: Get uploaded artifact ID
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        response=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
        artifact_id=$(python3 -c "import json,sys; resp=json.load(sys.stdin); print(next((a['id'] for a in resp.get('artifacts', []) if a.get('name') == 'playwright-artifacts'), ''))" <<< "$response")
        echo "ARTIFACT_ID=$artifact_id" >> $GITHUB_ENV

    - name: Deploy Playwright report to gh-pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        publish_branch: gh-pages
        keep_files: false
        user_name: github-actions[bot]
        user_email: github-actions[bot]@users.noreply.github.com
        cname: ''  # Add this if not using a custom domain

    - name: Publish Playwright report summary
      if: always()
      run: |
        repo=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
        echo "## Playwright HTML Report" >> $GITHUB_STEP_SUMMARY
        echo "The report is published to GitHub Pages:" >> $GITHUB_STEP_SUMMARY
        echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo}/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "If the Pages site isn't ready yet, download the artifact bundle from Actions artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The artifact will include trace ZIP files from test-results for failed runs." >> $GITHUB_STEP_SUMMARY
